:root{

  --fg:#1C2340; --mute:#59638A; --accent:#E8336D; --accent-fg:#FFFFFF; --go:#14833A; --go-fg:#FFFFFF;
  --bad:#C62828; --warn:#9A6208; --dot:#C9D2EA;
  --f-body:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;

  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,"Noto Sans Mono CJK JP",monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#10142A; --panel:#1A2040; --panel2:#262E58; --line:#343E70;
    --fg:#EAF0FF; --mute:#A8B2D8; --accent:#FF5F95; --accent-fg:#2A0613; --go:#4FD08A; --go-fg:#04210F;
    --bad:#FF7B7B; --warn:#E7B04A; --dot:#2A3260; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#10142A; --panel:#1A2040; --panel2:#262E58; --line:#343E70;
  --fg:#EAF0FF; --mute:#A8B2D8; --accent:#FF5F95; --accent-fg:#2A0613; --go:#4FD08A; --go-fg:#04210F;
  --bad:#FF7B7B; --warn:#E7B04A; --dot:#2A3260; color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:500 14px/1.5 var(--f-body);overflow:hidden;-webkit-tap-highlight-color:transparent}

/* 作業台 */
#selbar{display:flex;align-items:center;gap:6px;padding-block:6px;background:var(--panel);border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}

.ws{flex:1;min-height:0;overflow:auto;background-image:radial-gradient(var(--dot) 1.2px,transparent 1.2px);background-size:22px 22px;background-attachment:local;position:relative;touch-action:none}

.drop-target{outline:3px solid var(--accent);outline-offset:2px;position:relative;z-index:5}

#zoomBox button{border:0;background:transparent;min-height:40px;min-width:40px;padding:0 6px;font-weight:800;font-size:12px;display:flex;align-items:center;justify-content:center}

.palopen #floaters,.dragging #floaters{display:none}

.stack{display:flex;flex-direction:column;align-items:flex-start}

#trash.on{outline:4px solid var(--accent)}
.dragging #trash{display:flex}

/* ブロック */
.blk{--c:#888;--t:#fff;position:relative;display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;padding:8px 12px 10px;background:var(--c);color:var(--t);font-weight:800;font-size:14px;line-height:1.3;border-radius:6px;box-shadow:inset 0 -3px 0 rgba(0,0,0,.2);width:fit-content;max-width:100%;min-height:42px;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.blk::before{content:"";position:absolute;left:14px;top:0;width:26px;height:6px;background:rgba(0,0,0,.3);border-radius:0 0 6px 6px}
.blk::after{content:"";position:absolute;left:14px;bottom:-6px;width:26px;height:6px;background:var(--c);border-radius:0 0 6px 6px;z-index:1}
.blk.hat{border-radius:24px 24px 6px 6px;padding-top:14px;margin-top:4px}
.blk.hat::before,.blk.rep::before{display:none}
.blk.cap::after,.blk.rep::after{display:none}
.blk.c{display:block;padding:0;box-shadow:none}
.blk.c>.row{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;padding:8px 12px 10px;min-height:42px;box-shadow:inset 0 -3px 0 rgba(0,0,0,.2)}
.blk.c>.row.mid{box-shadow:inset 0 -3px 0 rgba(0,0,0,.2),inset 0 3px 0 rgba(0,0,0,.12)}
.blk.c>.arm{margin-left:18px;min-height:36px;background:rgba(0,0,0,.2);padding:2px 0 8px}
.blk.c>.arm>.stack:empty::before{content:"ここにブロックを置く";display:block;padding:8px 12px;font-size:12px;opacity:.75}
.blk.c>.foot{height:18px;box-shadow:inset 0 -3px 0 rgba(0,0,0,.2)}
.blk.rep{min-height:28px;padding:2px 10px;border-radius:14px;box-shadow:inset 0 -2px 0 rgba(0,0,0,.2);font-size:13px;gap:4px 6px}
.blk.rep:has(.blk.rep){padding:5px 8px;border-radius:16px}
.blk.rep .blk.rep{box-shadow:inset 0 -2px 0 rgba(0,0,0,.2),0 0 0 1.5px rgba(255,255,255,.2)}
.blk.rep.bool.tall{clip-path:none;border-radius:14px;padding:4px 12px}
.blk.rep>.blk.rep{max-width:100%}
.blk.rep{align-items:center}
.blk.rep.bool{border-radius:4px;clip-path:polygon(10px 0,calc(100% - 10px) 0,100% 50%,calc(100% - 10px) 100%,10px 100%,0 50%);padding:2px 18px}
.blk.rep.bool:has(.blk.rep.bool){clip-path:none;border-radius:14px;padding:4px 12px}
.blk.sel{outline:3px solid var(--accent);outline-offset:2px}
.blk.lifted{opacity:.35}
.slot{display:inline-flex;align-items:center;min-width:30px;min-height:28px;padding:2px 10px;border-radius:14px;background:#fff;color:#1C2340;font-weight:800;font-size:13px;max-width:100%;overflow-wrap:anywhere;cursor:pointer;box-shadow:inset 0 1px 0 rgba(0,0,0,.12)}
.slot.empty{color:#7A83A6}
.slot.menu,.slot.elem,.slot.var,.slot.list,.slot.proc,.slot.page{background:rgba(0,0,0,.24);color:var(--t);box-shadow:none}
.slot.menu::after,.slot.elem::after,.slot.var::after,.slot.list::after,.slot.proc::after,.slot.page::after{content:"▾";margin-left:6px;font-size:11px}
.slot.name{background:rgba(255,255,255,.88);border:2px dashed rgba(0,0,0,.25)}
.slot.color{padding:2px 6px 2px 4px;gap:6px}
.slot.color i{width:18px;height:18px;border-radius:50%;border:2px solid rgba(0,0,0,.25);display:block}
.slot.bool{border-radius:4px;min-width:36px;background:rgba(0,0,0,.25);clip-path:polygon(8px 0,calc(100% - 8px) 0,100% 50%,calc(100% - 8px) 100%,8px 100%,0 50%);padding:2px 14px}
.pal .slot,.pal .blk{pointer-events:none}
.pal .blk{pointer-events:auto}
.pal .slot{pointer-events:none}
/* 棚とカテゴリ */

/* ===== 拡張の読み込み ===== */
const BASE_DEFS = new Set(Object.keys(DEFS));
const BASE_CATS = CATS.map(c => c.id);
function resetExt() {
  Object.keys(DEFS).forEach(k => { if (!BASE_DEFS.has(k)) delete DEFS[k]; });
  for (let i = CATS.length - 1; i >= 0; i--) if (!BASE_CATS.includes(CATS[i].id)) { delete CATMAP[CATS[i].id]; CATS.splice(i, 1); }
}
function registerExtBlock(x) {
  const args = {};
  for (const k in x.args) { const t = x.args[k]; args[k] = t === 'num' ? Nn(0) : t === 'bool' ? Bo() : T(''); }
  def('x_' + x.id, 'ext', x.kind, x.label, args, g => x.code.replace(/\{(\w+)\}/g, (m, k) => (k in args ? g.e(k) : m)), { custom: true });
}
function loadExt() {
  resetExt();
  const p = P();
  p.ext.blocks.forEach(registerExtBlock);
  p.ext.scripts.forEach(sc => { try { new Function('BK', sc.code)(BK); } catch (e) { toast('拡張スクリプトのエラー: ' + e.message); } });
}
/* ===== 画面の状態と描画 ===== */
const app = $('#app'), ws = $('#ws'), pal = $('#pal'), catRow = $('#catRow'), selbar = $('#selbar');
let sel = null, openCat = null;
const isHat = b => { const d = DEFS[b && b.t]; return !!d && d.kind === 'hat'; };
const mini = (t, fn, cls) => h('button', { class: 'btn small ' + (cls || 'accent'), type: 'button', onclick: fn }, t);

function renderSlot(b, k, d, o) {
  const spec = d.args[k] || { t: 'text' }, v = b.a[k];
  if (v && typeof v === 'object') return renderBlock(v, o);
  const t = spec.t, s = h('span', { class: 'slot ' + t, 'data-owner': b.id, 'data-key': k });
  if (t === 'color') { s.append(h('i', { style: 'background:' + v }), String(v)); }
  else if (t === 'menu') { const m = spec.o.find(x => x[0] === v); s.textContent = m ? m[1] : String(v); }
  else if (t === 'bool') { s.textContent = ' '; }
  else {
    const txt = String(v == null ? '' : v);
    if (txt === '') { s.classList.add('empty'); s.textContent = ['elem', 'var', 'list', 'proc', 'page'].includes(t) ? '選ぶ' : t === 'num' ? '0' : t === 'name' ? '名前' : '　　'; }
    else s.textContent = txt;
  }
  return s;
}
function renderBlock(b, o) {
  const d = DEFS[b.t];
  if (!d) return h('div', { class: 'blk', 'data-id': b.id, style: '--c:#777' }, '(対応していないブロック)');
  const c = CATMAP[d.cat] || { color: '#777', text: '#fff' };
  const kc = { hat: 'hat', c: 'c', cap: 'cap', reporter: 'rep', bool: 'rep bool' }[d.kind] || '';
  const el = h('div', { class: 'blk ' + kc, 'data-id': b.id, style: '--c:' + c.color + ';--t:' + c.text });
  const label = host => d.parts.forEach(p => { if (p.s) host.append(p.s); else host.append(renderSlot(b, p.a, d, o)); });
  if (d.kind === 'c') {
    const row = h('div', { class: 'row' }); label(row); el.append(row);
    (d.kids || ['do']).forEach((k, i) => {
      if (i > 0) el.append(h('div', { class: 'row mid' }, d.elseLabel || ''));
      b.c[k] = b.c[k] || [];
      const st = h('div', { class: 'stack', 'data-slot': k, 'data-owner': b.id });
      b.c[k].forEach(x => st.append(renderBlock(x, o)));
      el.append(h('div', { class: 'arm' }, st));
    });
    el.append(h('div', { class: 'foot' }));
  } else label(el);
  if (!o.pal && sel === b.id) el.classList.add('sel');
  return el;
}
function renderWs() {
  const keepT = ws.scrollTop, keepL = ws.scrollLeft;
  ws.innerHTML = '';
  const cv = h('div', { class: 'canvas', id: 'canvas' }), zm = h('div', { id: 'zoomer' });
  zm.style.transform = 'scale(' + zoom() + ')';
  cv.append(zm); ws.append(cv);
  const p = P();
  if (!p.scripts.length) {
    cv.append(h('div', { class: 'empty-ws' },
      h('p', null, h('b', null, 'ここにブロックを置いてアプリを作るよ。')),
      h('p', null, '① 下の「イベント」をタップして、黄色いブロックをタップ。作業台の空いている所に出てくる。'),
      h('p', null, '② 出てきたブロックを、そのままドラッグして、つなげたい所に近づける。'),
      h('p', null, '③ 白い四角やプルダウンをタップすると、文字や選択肢を変えられる。'),
      h('p', null, '④ 2本の指で広げたり、右下の＋−で、拡大・縮小できる。'),
      h('p', null, '右上の「実行」で動かしてみよう。')));
  }
  const els = [];
  p.scripts.forEach(s => {
    const first = s.blocks[0], k = first && DEFS[first.t] && DEFS[first.t].kind;
    const cls = k === 'hat' ? '' : (k === 'reporter' || k === 'bool') ? ' floatrep' : ' loose';
    const st = h('div', { class: 'stack', 'data-script': s.id });
    s.blocks.forEach(b => st.append(renderBlock(b, {})));
    const el = h('div', { class: 'script' + cls + (s.id === freshId ? ' fresh' : ''), 'data-script': s.id }, st);
    const has = typeof s.x === 'number' && typeof s.y === 'number';
    el.style.left = (has ? s.x : 16) + 'px'; el.style.top = (has ? s.y : 0) + 'px';
    zm.append(el); els.push([s, el, has]);
  });
  freshId = null;
  let nextY = 16;
  els.forEach(e => { if (e[2]) nextY = Math.max(nextY, e[0].y + e[1].offsetHeight + 28); });
  els.forEach(e => { if (!e[2]) { e[0].x = 16; e[0].y = nextY; e[1].style.left = '16px'; e[1].style.top = nextY + 'px'; nextY += e[1].offsetHeight + 28; } });
  fixShapes(ws);
  avoidOverlap(els);
  sizeCanvas(); updateZoomLabel();
  ws.scrollTop = keepT; ws.scrollLeft = keepL;
  renderSelbar();
}
/* 背が高くなった六角形(条件)は、くずれないよう角丸の四角に切りかえる */
function fixShapes(root) {
  [].forEach.call((root || document).querySelectorAll('.blk.rep.bool'), e => { e.classList.remove('tall'); });

    const msgs = (d.msgs || []).map(m => ({ role: m.role, content: String(m.content) }));

  if (!store) {

    loadExt(); saveNow();
  }
  sel = null; openCat = null;
  loadExt(); renderDev(); renderCodeSeg(); renderAll(); setView('blocks'); run();
  if (window.__splashHide) requestAnimationFrame(() => window.__splashHide());
}

boot();
})();
